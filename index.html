<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoordoEPS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#06281a">
<style>
/* VOICE  : le bureau du coordonnateur EPS : organiser l'année de toute l'équipe, puis la transmettre
   IDEA   : le grand planning mural de la salle des profs d'EPS (classes × semaines, couleurs par champ d'apprentissage)
   COLOUR / TYPE : logo CoordoEPS (vert profond, jaune), system-ui
   LAYOUT : menu bas à 5 entrées (Année, Équipe, Emplois du temps, Programmation, Partage) */
:root{--bg:#06231a;--tx:#eefaf1;--mut:rgba(238,250,241,.62);--glass:rgba(255,255,255,.07);--bd:rgba(255,255,255,.15);--c1:#ffd60a;--c2:#3ccf5a;--c3:#fff1a0;--ok:#7ff09a;--ko:#ff8f8f;--wa:#ffb347;--cell:#0a2e22;--cell2:#0d3527;--head:#082a1e}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;overflow-x:clip}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 8% 4%,rgba(255,214,10,.13),transparent 55%),radial-gradient(ellipse at 94% 96%,rgba(60,207,90,.18),transparent 55%)}
header{position:relative;display:flex;align-items:center;gap:14px;padding:16px 16px 14px;flex-wrap:wrap}
header::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#1f9d3a 15%,#ffd60a 50%,#3ccf5a 85%,transparent)}
header img.lg{width:64px;height:64px;border-radius:22%;box-shadow:0 0 0 2px rgba(255,255,255,.28),0 0 24px rgba(255,214,10,.35),0 6px 16px rgba(0,0,0,.45);transition:transform .3s}
header img.lg:hover{transform:rotate(-5deg) scale(1.05)}
header h1{margin:0;font-style:italic;font-weight:900;line-height:1.05;font-size:1.9rem;color:#fff;text-shadow:0 2px 0 #02180f,0 4px 14px rgba(0,0,0,.5);white-space:nowrap}
header h1 .tm{background:linear-gradient(180deg,#fff59a,#ffd60a 55%,#f0b400);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 0 #02180f)}
header .ttl p{margin:4px 0 0;font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(226,255,236,.65)}
.sp{flex:1}
main{padding:0 14px 100px}
.btn{border:0;border-radius:12px;padding:9px 14px;font:inherit;font-weight:800;font-size:.86rem;color:#fff;cursor:pointer;background:linear-gradient(135deg,#1f9d3a,#3ccf5a);box-shadow:0 4px 14px #1f9d3a40;min-height:40px;white-space:nowrap}
.btn.y{background:linear-gradient(135deg,#ffd60a,#f0a500);color:#1d1700;box-shadow:0 4px 14px #f0a50040}
.btn.r{background:rgba(255,255,255,.08);border:1.5px solid var(--bd);box-shadow:none}
.btn.k{background:linear-gradient(135deg,#ff6b6b,#c21e1e)}
.btn.s{padding:4px 9px;min-height:30px;font-size:.78rem;border-radius:9px}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.4}
select,input,textarea{padding:9px 11px;border-radius:11px;border:1.5px solid var(--bd);font:inherit;font-size:16px;background:rgba(0,0,0,.32);color:var(--tx)}
input[type=color]{padding:2px;width:42px;height:36px}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--c1);outline-offset:1px}
label{display:block;font-weight:700;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
label input,label select,label textarea{display:block;width:100%;margin-top:4px}
.msg{font-size:.82rem;font-weight:700;min-height:1.2em}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.bar h2{margin:0;font-size:1.05rem;font-weight:900}
.card{background:var(--glass);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c1)}
.og{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:12px}.og .card{margin:0}.full{grid-column:1/-1}
.rw{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:5px 0}.rw input,.rw select{padding:6px 8px;font-size:15px}.rw input[type=text]{flex:1;min-width:110px}
.rw label{margin:0}
.help{color:var(--mut);font-size:.78rem;margin:4px 0}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-weight:600;margin:6px 0}
.chk input{width:20px;height:20px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{background:rgba(255,255,255,.08);border-radius:20px;padding:3px 10px;font-size:.8rem;font-weight:700}
.code{display:inline-block;border-radius:6px;padding:0 6px;font-weight:900;font-size:.75rem;color:#06231a}
.ok{color:var(--ok)}.ko{color:var(--ko)}.wa{color:var(--wa)}
.empty{border:2px dashed var(--bd);border-radius:18px;padding:28px;text-align:center;color:var(--mut);margin:14px 0}
.empty b{color:var(--tx);display:block;font-size:1.05rem;margin-bottom:6px}
/* tableaux */
.tw{overflow:auto;border:1px solid var(--bd);border-radius:14px;background:var(--cell)}
table.t{border-collapse:separate;border-spacing:0;font-size:.85rem;width:100%}
.t th,.t td{border-bottom:1px solid rgba(255,255,255,.07);padding:5px 7px;text-align:left;vertical-align:top}
.t thead th{background:var(--head);position:sticky;top:0;z-index:2;font-size:.76rem;color:var(--mut)}
.t tbody tr:nth-child(even) td{background:var(--cell2)}
.t td.n,.t th.n{text-align:right;white-space:nowrap}
.t tr.on td{background:rgba(255,214,10,.12)!important}
.t select,.t input{padding:5px 7px;font-size:14px}
tr[data-o]{cursor:pointer}
.ocl{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.ocl button{border:1.5px solid var(--bd);border-radius:20px;padding:6px 14px;background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-weight:800;cursor:pointer;min-height:38px}
.ocl button small{color:var(--mut);font-weight:600;margin-left:4px}
.ocl button.on{border-color:transparent;background:linear-gradient(135deg,#1f9d3a,#3ccf5a);color:#fff}.ocl button.on small{color:#e9ffe9}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:middle;margin-right:4px;border:1px solid #0006}
/* semaines A/B */
.wks{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:5px}
.wks button{border:1px solid var(--bd);border-radius:9px;padding:5px 7px;background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-size:.75rem;cursor:pointer;text-align:left;min-height:44px}
.wks button b{float:right;font-size:.95rem}.wks .A b{color:var(--c1)}.wks .B b{color:var(--c2)}.wks .fl{border-color:var(--c3)}.wks .vac{opacity:.35;cursor:default}.wks small{color:var(--mut)}
/* grille hebdomadaire */
.wg{display:grid;grid-template-columns:46px repeat(var(--nd),minmax(120px,1fr));border:1px solid var(--bd);border-radius:14px;overflow:auto;background:var(--cell)}
.wg .dh{position:sticky;top:0;background:var(--head);text-align:center;font-weight:900;padding:6px;border-left:1px solid var(--bd);z-index:3}
.wg .hc{position:relative;height:var(--h);margin:8px 0}.wg .hc span{position:absolute;right:4px;font-size:.68rem;color:var(--mut);transform:translateY(-50%)}
.wg .dc{position:relative;height:var(--h);margin:8px 0;border-left:1px solid var(--bd)}
.wg .hl{position:absolute;left:0;right:0;border-top:1px dashed rgba(255,255,255,.08)}
.blk{position:absolute;border-radius:8px;padding:3px 5px;font-size:.72rem;line-height:1.2;overflow:hidden;color:#06231a;cursor:pointer;border:1px solid #0006;font-weight:700;box-shadow:0 2px 6px #0005}
.blk b{display:block;font-size:.8rem;font-weight:900}.blk i{font-style:normal;opacity:.8}
.blk.ab{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,255,255,.28) 6px 12px)}
.blk.cf{outline:3px solid #ff3b3b;outline-offset:-1px}
/* planning annuel */
.gt{border:1px solid var(--bd);border-radius:14px;background:var(--cell);overflow:auto}
.gt .gr{display:grid;grid-template-columns:130px 1fr;min-width:900px;border-bottom:1px solid rgba(255,255,255,.06)}
.gt .gl{padding:4px 8px;font-size:.8rem;font-weight:800;position:sticky;left:0;background:var(--cell);z-index:2;border-right:1px solid var(--bd);cursor:pointer}
.gt .gl small{display:block;color:var(--mut);font-weight:600;font-size:.68rem}
.gt .gn{grid-column:1/-1;padding:4px 8px;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--c1);background:var(--head)}
.trk{position:relative}
.vb{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 4px,rgba(255,255,255,.1) 4px 8px)}
.mt{position:absolute;top:0;bottom:0;border-left:1px solid rgba(255,255,255,.12);font-size:.66rem;color:var(--mut);padding-left:3px;white-space:nowrap}
.td{position:absolute;top:0;bottom:0;border-left:2px solid var(--ko);z-index:1}
.cb{position:absolute;height:20px;border-radius:6px;font-size:.68rem;padding:2px 5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#06231a;font-weight:800;border:1px solid #0006;cursor:pointer}
.ev{position:absolute;width:11px;height:11px;margin-left:-5px;transform:rotate(45deg);background:#fff;border:2px solid #06231a;z-index:2;cursor:help}.ev.ccf{background:#ff3b3b}
.pl{position:absolute;top:0;bottom:0;border-left:2px dashed rgba(255,214,10,.45)}
.evl{display:flex;gap:4px;align-items:center;margin:3px 0;flex-wrap:nowrap}.evl select,.evl input{padding:4px 5px;font-size:13px}
textarea{width:100%;resize:vertical}
.lgd{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;margin:8px 0}
/* fenêtres */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:4vh 10px;overflow:auto}
.mo{background:#0b3022;border:1px solid var(--bd);border-radius:18px;padding:18px;width:min(580px,100%);box-shadow:0 20px 60px #000c}
.mo h3{margin:0 0 6px;font-size:1.05rem;color:var(--c1)}
.lst{max-height:280px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:4px 10px}
/* menu bas */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;gap:6px;padding:6px 10px calc(6px + env(safe-area-inset-bottom));background:rgba(3,24,16,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--bd);box-shadow:0 -6px 20px #0008}
.bnav button{flex:1;max-width:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;border-radius:14px;padding:6px 4px;background:none;color:var(--mut);font:inherit;font-size:.72rem;font-weight:800;cursor:pointer;min-height:54px;line-height:1.1;text-align:center}
.bnav button b{font-size:1.3rem;line-height:1}
.bnav button.on{color:#fff;background:linear-gradient(135deg,rgba(31,157,58,.7),rgba(255,214,10,.45))}
.bnav button:not(.on):hover{color:var(--tx);background:rgba(255,255,255,.06)}
@media(max-width:600px){header{padding:10px}header img.lg{width:48px;height:48px}header h1{font-size:1.4rem}header .ttl p{display:none}.hide-s{display:none}.bnav button{font-size:.62rem}}
/* impression */
@media print{
 body{background:#fff;color:#000;font-size:11px}body::before,.bnav,header .btn,.np,.ov{display:none!important}
 body[data-pr] .card:not(.prx){display:none}body[data-pr] .bar{display:none}
 .card{border:1px solid #999;background:#fff;break-inside:avoid}.card h3{color:#000}
 .wg,.gt,.tw{background:#fff;overflow:visible;border-color:#999}.wg .dh,.gt .gl,.gt .gn,.t thead th{background:#eee;color:#000}.gt .gl{position:static}
 .t td{background:#fff!important;color:#000}.help,.mt,.gt .gl small{color:#444}.gt .gr{min-width:0}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
 <img src="icons/logo-CoordoEPS.png" alt="" class="lg"><div class="ttl"><h1>Coordo<span class="tm">EPS</span></h1><p>Programmation annuelle de l'équipe · Mes Apps EPS</p></div>
 <span class="sp"></span>
 <span class="msg" id="st"></span>
 <button class="btn r" data-g="share" title="Partager la programmation avec l'équipe">📤 <span class="hide-s">Partager</span></button>
</header>
<main><section id="view"></section></main>
<nav class="bnav" id="bnav" aria-label="Menu de l'application">
 <button data-nav="cal"><b>📅</b>Année</button>
 <button data-nav="equipe"><b>👥</b>Équipe et installations</button>
 <button data-nav="edt"><b>🗓️</b>Emplois du temps</button>
 <button data-nav="prog"><b>📚</b>Programmation</button>
 <button data-nav="share"><b>📤</b>Partage</button>
</nav>
<datalist id="apsaL"></datalist>
<div class="ov" id="ov" hidden><div class="mo" id="mo"></div></div>
<input type="file" id="fList" accept=".csv,.xlsx" hidden>
<input type="file" id="fJson" accept=".json" hidden>
<script src="version.js"></script>
<script src="eps-core.js"></script>
<script src="nouveautes.js"></script>
<script>
{
const APP='coordoeps',LS='CoordoEPS_v1',FMT='CoordoEPS',VER='1.1.0';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const frD=s=>{if(!s)return'';const d=new Date(s+'T12:00');return d.toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'})};
const sh=s=>frD(s).replace(/^\S+ /,'');
const addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const dd=(a,b)=>Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5);
const dow=s=>new Date(s+'T12:00').getDay();
const monday=s=>addD(s,-((dow(s)+6)%7));
const JOURS=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'],JL=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const tm=s=>{const[h,m]=String(s||'0:0').split(':');return(+h||0)*60+(+m||0)};
const fh=x=>(Math.round(x*100)/100).toString().replace('.',',')+' h';

/* Champs d'apprentissage et APSA : mêmes listes que SuiviProf EPS (les cycles s'importent tels quels) */
const CAS={CA1:'Réaliser une performance motrice maximale mesurable à une échéance donnée',CA2:'Adapter ses déplacements à des environnements variés',CA3:'Réaliser une prestation corporelle destinée à être vue et appréciée',CA4:'Conduire et maîtriser un affrontement collectif ou interindividuel',CA5:'Réaliser et orienter son activité physique pour développer ses ressources et s\'entretenir'};
const CAC={CA1:'#ff9f43',CA2:'#3ccf5a',CA3:'#d68bff',CA4:'#4fb3ff',CA5:'#ffd60a','':'#9fb0a6'};
const APSA={"Activités libres":"","Multi-activités":"","Athlétisme":"CA1","Acrosport":"CA3","Aérobic":"CA3","Arts du cirque":"CA3","Aquathlon":"CA1","Aviron":"CA1","Badminton":"CA4","Baseball":"CA4","Basket-ball":"CA4","Basket 3x3":"CA4","Beach-volley":"CA4","Biathlon":"CA1","BMX":"CA2","Boxe française (Savate)":"CA4","Canoë-kayak":"CA2","Course d'orientation":"CA2","Cyclisme sur route":"CA1","Danse chorégraphiée":"CA3","Danse hip-hop":"CA3","Double dutch":"CA3","Duathlon":"CA1","Équitation":"CA2","Escalade":"CA2","Fitness / Step":"CA5","Football":"CA4","Futsal":"CA4","Gymnastique artistique":"CA3","Gymnastique rythmique":"CA3","Handball":"CA4","Handball à 4":"CA4","Handisport":"","Hockey sur gazon":"CA4","Judo":"CA4","Karaté":"CA4","Kitesurf":"CA2","Laser run":"CA1","Musculation":"CA5","Natation":"CA1","Padel":"CA4","Pétanque":"","Planche à voile":"CA2","Raid multisports":"CA2","Rugby à VII":"CA4","Run & Bike":"CA1","Sauvetage aquatique":"CA2","Skateboard / Surfskate":"CA2","Ski alpin":"CA2","Sport partagé":"","Squash":"CA4","Surf":"CA2","Tennis":"CA4","Tennis de table":"CA4","Triathlon":"CA1","Ultimate frisbee":"CA4","Volley-ball":"CA4","Voile légère":"CA2","VTT":"CA2"};
const caOf=n=>APSA[n]??'';
const caSel=(v,attrs)=>`<select ${attrs} aria-label="Champ d'apprentissage"><option value="">CA ?</option>${Object.keys(CAS).map(k=>`<option value="${k}" title="${esc(CAS[k])}" ${v===k?'selected':''}>${k}</option>`).join('')}</select>`;
const caTag=k=>k?`<span class="code" style="background:${CAC[k]}" title="${esc(CAS[k])}">${k}</span>`:'';
const NIV=['6e','5e','4e','3e','2nde','1re','Tle','2nde Pro','1re Pro','Tle Pro','CAP 1','CAP 2','Autre'];
function guessNiv(cl){const s=String(cl).toUpperCase().replace(/\s+/g,'');
 if(/CAP/.test(s))return/^(1|CAP1)/.test(s)||/CAP.?1/.test(s)?'CAP 1':'CAP 2';const pro=/PRO|BAC|MRC|MELEC|MSPC|ASSP|GA|AGORA|MCV/.test(s);
 if(/^6/.test(s))return'6e';if(/^5/.test(s))return'5e';if(/^4/.test(s))return'4e';if(/^3/.test(s))return'3e';
 if(/^(2|SECONDE|SEC)/.test(s))return pro?'2nde Pro':'2nde';if(/^(1|PREM)/.test(s))return pro?'1re Pro':'1re';if(/^(T|TERM)/.test(s))return pro?'Tle Pro':'Tle';
 const m=/(6E|5E|4E|3E|2NDE|SECONDE|1RE|PREMIERE|TLE|TERM)/.exec(s.normalize('NFD').replace(/[\u0300-\u036f]/g,''));if(m)return guessNiv(m[1]+(pro?' PRO':''));return'Autre'}
const EVT=['Fin de cycle','CCF','CCF rattrapage','Diagnostique','Intermédiaire','Épreuve ponctuelle'];
const isCCF=t=>/CCF|ponctuelle/i.test(t||'');
const STAT={cert:['Certifié(e)',20],agr:['Agrégé(e)',17],contr:['Contractuel(le)',20],tzr:['TZR',20],stag:['Stagiaire',10],autre:['Autre',18]};
const ITYPES=['Gymnase','Salle spécialisée','Plateau extérieur','Piste / stade','Piscine','Mur d\'escalade','Site naturel','Autre'];
const PAL=['#4fb3ff','#ff9f43','#d68bff','#ff6b8b','#5fe0e0','#ffd60a','#a0e85f','#ff7f50','#9aa7ff','#f7a8ff','#7ff09a','#e0c080'];

/* ───── État (le fichier de partage reprend S tel quel, sans l'état d'affichage U) ───── */
let S={v:1,etab:'',auteur:'',org:null,profs:[],inst:[],classes:{}},U={view:'cal',cl:'',ef:'all',ew:'',pc:'ca',pn:''},E=[],FER=null,WK=null,OM='';
try{const j=JSON.parse(localStorage.getItem(LS));if(j&&j.classes)S=j}catch(e){}
try{Object.assign(U,JSON.parse(localStorage.getItem(LS+'_ui'))||{})}catch(e){}
function save(){FER=WK=null;S.maj=new Date().toISOString();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}saveU()}
function saveU(){try{localStorage.setItem(LS+'_ui',JSON.stringify(U))}catch(e){}}
const KL=cl=>S.classes[cl]||(S.classes[cl]={niveau:guessNiv(cl),prof:'',eval:'T',cren:[],cycles:[]});
const eff=cl=>E.filter(e=>e.classe===cl).length;
const maeCls=()=>[...new Set(E.map(e=>e.classe).filter(Boolean))].filter(c=>!S.classes[c]).sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));
const nivOf=cl=>(S.classes[cl]||{}).niveau||guessNiv(cl);
const allCls=()=>Object.keys(S.classes).sort((a,b)=>{const x=NIV.indexOf(nivOf(a)),y=NIV.indexOf(nivOf(b));return x-y||a.localeCompare(b,'fr',{numeric:true})});
const selCl=()=>{const L=allCls();if(!L.includes(U.cl))U.cl=L[0]||'';return U.cl};

/* ───── Calendrier : identique à SuiviProf EPS (année, vacances, fériés, semaines A/B, interruptions) ───── */
function paques(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),x=h+l-7*m+114;return iso(new Date(y,Math.floor(x/31)-1,x%31+1))}
function feries(y,als,pent){const p=paques(y),L=[[y+'-01-01',"Jour de l'an"],[addD(p,1),'Lundi de Pâques'],[y+'-05-01','Fête du Travail'],[y+'-05-08','Victoire 1945'],[addD(p,39),'Ascension'],...(pent?[]:[[addD(p,50),'Lundi de Pentecôte']]),[y+'-07-14','Fête nationale'],[y+'-08-15','Assomption'],[y+'-11-01','Toussaint'],[y+'-11-11','Armistice 1918'],[y+'-12-25','Noël']];
 if(als)L.push([addD(p,-2),'Vendredi saint'],[y+'-12-26','Saint-Étienne']);return L}
const CAL2627={commun:[['Vacances de la Toussaint','2026-10-17','2026-11-01'],['Vacances de Noël','2026-12-19','2027-01-03'],["Pont de l'Ascension",'2027-05-06','2027-05-09'],["Vacances d'été",'2027-07-03','2027-08-31']],
 A:[["Vacances d'hiver",'2027-02-13','2027-02-28'],['Vacances de printemps','2027-04-10','2027-04-25']],
 B:[["Vacances d'hiver",'2027-02-20','2027-03-07'],['Vacances de printemps','2027-04-17','2027-05-02']],
 C:[["Vacances d'hiver",'2027-02-06','2027-02-21'],['Vacances de printemps','2027-04-03','2027-04-18']]};
const vacDef=z=>[...CAL2627.commun,...(CAL2627[z]||[])].map(([nom,du,au])=>({nom,du,au})).sort((a,b)=>a.du.localeCompare(b.du));
function O(){if(!S.org)S.org={zone:'A',debut:'2026-09-01',fin:'2027-07-03',vac:vacDef('A'),als:false,pent:false,ab:'A',flip:[],inter:[],
  per:{T:[{nom:'Trimestre 1',du:'2026-09-01',au:'2026-11-28'},{nom:'Trimestre 2',du:'2026-11-30',au:'2027-03-06'},{nom:'Trimestre 3',du:'2027-03-08',au:'2027-07-03'}],
       S:[{nom:'Semestre 1',du:'2026-09-01',au:'2027-01-23'},{nom:'Semestre 2',du:'2027-01-25',au:'2027-07-03'}]}};return S.org}
const annee=()=>{const y=+O().debut.slice(0,4);return y+'-'+(y+1)};
function ferMap(){if(FER)return FER;const o=O();FER=new Map();for(let y=+o.debut.slice(0,4);y<=+o.fin.slice(0,4);y++)feries(y,o.als,o.pent).forEach(([d,n])=>FER.set(d,n));return FER}
const isVac=d=>O().vac.some(x=>x.du<=d&&d<=x.au);
function off(d,cl){const o=O();if(d<o.debut||d>o.fin)return'hors année scolaire';const v=o.vac.find(x=>x.du<=d&&d<=x.au);if(v)return v.nom;
 const f=ferMap().get(d);if(f)return f+' (férié)';const it=o.inter.find(x=>x.du<=d&&d<=x.au&&(!x.classes.length||x.classes.includes(cl)));return it?it.nom:''}
function weeks(){if(WK)return WK;const o=O();WK=new Map();let n=0;
 for(let m=monday(o.debut);m<=o.fin;m=addD(m,7)){const school=[0,1,2,3,4].some(i=>{const d=addD(m,i);return d>=o.debut&&d<=o.fin&&!isVac(d)});
  let L=(n%2===0)===(o.ab==='A')?'A':'B';if(o.flip.filter(f=>f<=m).length%2)L=L==='A'?'B':'A';WK.set(m,{L:school?L:'',school});if(school)n++}
 return WK}
const wk=d=>(weeks().get(monday(d))||{}).L||'';
function slots(cl,du,au,ids){const cr=KL(cl).cren.filter(c=>!ids||ids.includes(c.id)),out=[],skip=[];if(!du||!au||!cr.length)return{out,skip};
 for(let d=du;d<=au;d=addD(d,1)){const w=dow(d);for(const c of cr){if(+c.jour!==w)continue;if(c.sem!=='AB'&&wk(d)!==c.sem)continue;const r=off(d,cl);if(r)skip.push({date:d,c,r});else out.push({date:d,c})}}
 return{out,skip}}
async function vacNet(){const o=O(),y=+o.debut.slice(0,4),z=o.zone==='Corse'?'Corse':'Zone '+o.zone;
 const r=await fetch('https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-calendrier-scolaire/records?limit=100&where='+encodeURIComponent(`annee_scolaire="${y}-${y+1}" and zones="${z}"`));
 if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json(),m=new Map();
 for(const x of j.results||[]){if(/enseignant/i.test(x.population||''))continue;const du=iso(new Date(x.start_date)),au=addD(iso(new Date(x.end_date)),-1);if(du>o.fin||au<o.debut)continue;const k=x.description+du;if(!m.has(k))m.set(k,{nom:x.description,du,au})}
 const L=[...m.values()].sort((a,b)=>a.du.localeCompare(b.du));if(!L.length)throw new Error('aucune donnée pour cette zone');return L}

/* ───── Équipe, installations, créneaux ───── */
const PR=id=>S.profs.find(p=>p.id===id);
const pn=id=>{const p=PR(id);return p?(p.nom+(p.prenom?' '+p.prenom:'')).trim():''};
const pin=id=>{const p=PR(id);return p?((p.prenom||'')[0]||'')+((p.nom||'')[0]||''):''};
const pcol=id=>PR(id)?.couleur||'#9fb0a6';
const IN=id=>S.inst.find(i=>i.id===id);const inN=id=>IN(id)?.nom||'';
const crP=(cl,c)=>c.prof||KL(cl).prof||'';
const crLab=c=>`${JOURS[c.jour]} ${c.hd}–${c.hf}${c.sem==='AB'?'':' · sem. '+c.sem}`;
const dur=c=>Math.max(0,tm(c.hf)-tm(c.hd))/60,wgt=c=>c.sem==='AB'?1:.5;
const CR=()=>allCls().flatMap(cl=>KL(cl).cren.map(c=>({cl,c,prof:crP(cl,c),inst:c.inst||''})));
const ovl=(a,b)=>+a.jour===+b.jour&&tm(a.hd)<tm(b.hf)&&tm(b.hd)<tm(a.hf)&&(a.sem==='AB'||b.sem==='AB'||a.sem===b.sem);
const teaches=(pid,cl)=>KL(cl).prof===pid||KL(cl).cren.some(c=>c.prof===pid);
function service(pid){let h=0;const cls=new Set();for(const x of CR())if(x.prof===pid){h+=dur(x.c)*wgt(x.c);cls.add(x.cl)}return{h,cls:[...cls]}}
/* Conflits hebdomadaires : un enseignant sur deux créneaux en même temps, une installation au-delà de sa capacité */
function conflits(){const L=CR(),P=[],I=[],ids=new Set(),seen=new Set();
 for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++){const a=L[i],b=L[j];if(!ovl(a.c,b.c))continue;
  if(a.prof&&a.prof===b.prof){P.push({a,b});ids.add(a.c.id);ids.add(b.c.id)}}
 for(const a of L){if(!a.inst)continue;const g=L.filter(b=>b.inst===a.inst&&ovl(a.c,b.c)),cap=+(IN(a.inst)?.cap||1);
  if(g.length>cap){g.forEach(x=>ids.add(x.c.id));const k=a.inst+'|'+g.map(x=>x.c.id).sort().join();if(!seen.has(k)){seen.add(k);I.push({inst:a.inst,g,cap})}}}
 return{P,I,ids}}

/* ───── Cycles ───── */
const cyS=(cl,c)=>slots(cl,c.du,c.au,c.cren||[]);
const cyH=(cl,c)=>cyS(cl,c).out.reduce((n,x)=>n+dur(x.c),0);
const sortCy=K=>[...K.cycles].sort((a,b)=>(a.du||'9').localeCompare(b.du||'9'));
const cyInst=(cl,c,cr)=>c.inst||cr?.inst||'';
function caH(cl){const o={};for(const c of KL(cl).cycles){if(!c.du||!c.au)continue;const k=c.ca||'';o[k]=(o[k]||0)+cyH(cl,c)}return o}
function controles(cl){const K=KL(cl),o=O(),w=[];if(!K.cren.length){w.push('aucun créneau');return w}
 if(!K.prof&&K.cren.some(c=>!c.prof))w.push('enseignant non désigné');
 const cy=K.cycles;cy.filter(c=>!c.du||!c.au).forEach(c=>w.push(`« ${c.nom} » sans dates`));cy.filter(c=>c.du&&!c.ca).forEach(c=>w.push(`« ${c.nom} » sans CA`));
 const all=slots(cl,o.debut,o.fin,null).out,cov=x=>cy.filter(c=>c.du&&c.au&&c.du<=x.date&&x.date<=c.au&&(c.cren||[]).includes(x.c.id)).length;
 let nc=0,dbl=0;for(const x of all){const n=cov(x);if(!n)nc++;else if(n>1)dbl++}
 if(nc)w.push(`${nc} séance(s) hors cycle`);
 const ne=cy.filter(c=>c.du&&!(c.evals||[]).some(v=>v.date)).length;if(ne)w.push(`${ne} cycle(s) sans date d'évaluation`);
 const ho=cy.flatMap(c=>(c.evals||[]).filter(v=>v.date&&!cyS(cl,c).out.some(x=>x.date===v.date))).length;if(ho)w.push(`${ho} évaluation(s) un jour sans séance`);if(dbl)w.push(`${dbl} séance(s) partagées par 2 cycles`);return w}
/* Occupation des installations date par date (installation du cycle, sinon celle du créneau) */
function occupation(){const M=new Map();
 for(const cl of allCls())for(const cy of KL(cl).cycles)for(const x of cyS(cl,cy).out){const i=cyInst(cl,cy,x.c);if(!i)continue;const k=i+'|'+x.date;if(!M.has(k))M.set(k,[]);M.get(k).push({cl,cy,c:x.c})}
 const out=[];for(const[k,L]of M){const[i,date]=k.split('|'),cap=+(IN(i)?.cap||1);if(L.length<=cap)continue;
  const g=L.filter(a=>L.filter(b=>tm(a.c.hd)<tm(b.c.hf)&&tm(b.c.hd)<tm(a.c.hf)).length>cap);if(g.length)out.push({inst:i,date,g,cap})}
 return out.sort((a,b)=>a.date.localeCompare(b.date))}
function repartir(n,cl){const K=KL(cl);if(!K.cren.length){OM="⚠ Ajoutez d'abord les créneaux de la classe (Emplois du temps)";return}
 const o=O(),dates=[...new Set(slots(cl,o.debut,o.fin,null).out.map(x=>x.date))];if(dates.length<n){OM='⚠ Pas assez de séances dans l\'année';return}
 const per=dates.length/n,cy=sortCy(K);
 for(let i=0;i<n;i++){let c=cy[i];if(!c){c={id:uid(),nom:'Cycle '+(i+1),ca:'',inst:''};K.cycles.push(c)}
  c.du=dates[Math.round(i*per)];c.au=dates[Math.round((i+1)*per)-1];c.cren=K.cren.map(x=>x.id)}
 OM=`✅ ${n} cycles d'environ ${Math.round(per)} jours de cours : choisissez les APSA et ajustez les dates`}

const optI=(v,vide='— installation —')=>`<option value="">${vide}</option>`+S.inst.map(i=>`<option value="${i.id}" ${v===i.id?'selected':''}>${esc(i.nom)}</option>`).join('');

 const fer=[...ferMap()].filter(([d])=>d>=o.debut&&d<=o.fin&&dow(d)%6).sort((a,b)=>a[0].localeCompare(b[0]));
 let h=head('📅 Année scolaire '+annee(),"Calendrier commun à toute l'équipe. Il est transmis avec la programmation : chaque collègue retrouve les mêmes vacances, fériés, semaines A/B et périodes dans SuiviProf EPS.")+'<div class="og">';

 h+=`<div class="card full"><h3>Préparer l'année suivante</h3><div class="rw"><span class="help" style="flex:1">La programmation se prépare en fin d'année, sans les listes Pronote : on part de l'année en cours, décalée d'un an (mêmes jours de la semaine), puis on ajuste classes, services, cycles et évaluations.</span><button class="btn y" data-o="next">➡️ Préparer ${+annee().slice(0,4)+1}-${+annee().slice(0,4)+2}</button></div></div>`;

 ${o.vac.map((x,i)=>`<div class="rw"><input type="text" data-k="vac" data-i="${i}" data-p="nom" value="${esc(x.nom)}" aria-label="Nom"><input type="date" data-k="vac" data-i="${i}" data-p="du" value="${x.du}" aria-label="Premier jour"><input type="date" data-k="vac" data-i="${i}" data-p="au" value="${x.au}" aria-label="Dernier jour"><button class="btn s k" data-o="vac-rm" data-i="${i}">✕</button></div>`).join('')}
 <div class="rw"><button class="btn s r" data-o="vac-add">＋ Période de vacances</button></div><p class="help">Dates : premier jour sans cours → veille de la reprise.</p>
 <label>Jours fériés en semaine (calculés automatiquement)</label><div class="chips">${fer.map(([d,n])=>`<span>${esc(frD(d))} · ${esc(n)}</span>`).join('')}</div></div>`;
 h+=`<div class="card"><h3>Périodes interruptives</h3>${o.inter.map((x,i)=>`<div class="rw"><span style="flex:1"><b>${esc(x.nom)}</b> · ${esc(frD(x.du))} → ${esc(frD(x.au))}<br><span class="help">${x.classes.length?esc(x.classes.join(', ')):'toutes les classes'}</span></span><button class="btn s k" data-o="int-rm" data-i="${i}">✕</button></div>`).join('')||'<p class="help">Aucune : stages en entreprise, examens, voyages, installation indisponible…</p>'}

 <h3 style="margin-top:16px">Périodes d'évaluation</h3>${['T','S'].map(t=>`<label>${t==='T'?'Trimestres':'Semestres'}</label>`+o.per[t].map((p,i)=>`<div class="rw"><span style="width:96px">${esc(p.nom)}</span><input type="date" data-k="per" data-pt="${t}" data-i="${i}" data-p="du" value="${p.du}" aria-label="Début"> → <input type="date" data-k="per" data-pt="${t}" data-i="${i}" data-p="au" value="${p.au}" aria-label="Fin"></div>`).join('')).join('')}</div>`;

 <div class="wks">${[...weeks()].map(([m,w])=>w.school?`<button class="${w.L}${o.flip.includes(m)?' fl':''}" data-o="flip" data-m="${m}">${esc(sh(m))}<b>${w.L}</b>${o.flip.includes(m)?'<br><small>↺ bascule</small>':''}</button>`:`<button class="vac" disabled>${esc(sh(m))}<br><small>vacances</small></button>`).join('')}</div></div></div>`;
 $('#view').innerHTML=h}

 const evs=[['Date','Type','Classe','Niveau','APSA','CA','Enseignant','Horaire','Installation'],...allEvals().filter(x=>!x.per).map(x=>[x.date,x.type,x.cl,KL(x.cl).niveau,x.c.nom,x.c.ca||'',pn(x.prof),x.cr?x.cr.hd+'–'+x.cr.hf:'pas de séance ce jour',inN(x.inst)])];
 const prog=[['Classe','Niveau','Enseignant','APSA','CA','Du','Au','Créneaux','Installation','Séances','Heures','Évaluations'],...cls.flatMap(cl=>sortCy(KL(cl)).map(c=>{const r=cyS(cl,c);return[cl,KL(cl).niveau,pn(KL(cl).prof),c.nom,c.ca||'',c.du||'',c.au||'',KL(cl).cren.filter(x=>(c.cren||[]).includes(x.id)).map(crLab).join(' / '),inN(c.inst)||[...new Set(KL(cl).cren.filter(x=>(c.cren||[]).includes(x.id)).map(x=>inN(x.inst)).filter(Boolean))].join(' / '),r.out.length,r2(r.out.reduce((n,x)=>n+dur(x.c),0)),(c.evals||[]).filter(v=>v.date).map(v=>v.type+' '+v.date).join(' / ')]}))];
 const ca=[['Classe','Niveau',...Kc.map(k=>k+' (h)'),'Points à vérifier'],...cls.map(cl=>{const c=caH(cl);return[cl,KL(cl).niveau,...Kc.map(k=>c[k]?r2(c[k]):0),controles(cl).join(' · ')]})];
 return xlsx([{name:'Programmation',rows:prog},{name:'Évaluations',rows:evs},{name:'Emplois du temps',rows:edt},{name:'Équipe et services',rows:eq},{name:'Installations',rows:ins},{name:'Heures par CA',rows:ca},{name:'Calendrier',rows:cal.slice(0,1).concat(cal.slice(1).sort((a,b)=>String(a[2]).localeCompare(String(b[2]))))}])}

/* Mes Apps EPS : une ligne par cycle pour chaque élève de la classe */
function lignes(cl){const K=S.classes[cl];if(!K)return[];return sortCy(K).filter(c=>c.du&&c.au).map(c=>{const cr=K.cren.filter(x=>(c.cren||[]).includes(x.id));return{Date:c.du,Fin:c.au,Cycle:c.nom,CA:c.ca||'',Enseignant:pn([...new Set(cr.map(x=>crP(cl,x)))][0]||K.prof),Installation:inN(c.inst)||[...new Set(cr.map(x=>inN(x.inst)).filter(Boolean))].join(' / '),'Créneaux':cr.map(crLab).join(' / '),'Séances':cyS(cl,c).out.length,'Évaluations':(c.evals||[]).filter(v=>v.date).map(v=>v.type+' '+v.date).join(' / ')}})}
async function sync(){const m=$('#sm');try{E=await EPS.all();if(!E.length)throw new Error('aucune liste d\'élèves sur cet appareil');let n=0,k=0;
 for(const e of E){const l=lignes(e.classe);const had=e.ext&&e.ext[APP];if(!l.length&&!had)continue;await EPS.setExt(APP,e.id,{lignes:l});n++;k+=l.length}
 m.style.color='var(--ok)';m.textContent=`✅ ${n} élève(s) mis à jour (${k} ligne(s))`}catch(x){m.style.color='var(--ko)';m.textContent='❌ '+x.message}}
async function exportMAE(){const m=$('#sm');try{const b=await EPS.exportXLSX({apps:[APP]});EPS.downloadXLSX(b,`CoordoEPS_${today()}.xlsx`);m.textContent='⬇ Export lancé'}catch(x){m.style.color='var(--ko)';m.textContent='❌ '+x.message+' (enregistrez d\'abord dans Mes Apps EPS)'}}

/* Exemple complet */
function demo(){if((S.profs.length||Object.values(S.classes).some(k=>k.cycles.length||k.cren.length))&&!confirm('Remplacer la programmation actuelle par l\'exemple ?'))return;
 const p=(nom,prenom,statut,c)=>({id:uid(),nom,prenom,statut,ors:STAT[statut][1],as:3,couleur:c}),P=[p('MARTIN','Claire','agr','#4fb3ff'),p('DURAND','Karim','cert','#ff9f43'),p('LEROY','Sophie','cert','#d68bff'),p('PETIT','Hugo','contr','#ff6b8b')];
 const i=(nom,type,cap)=>({id:uid(),nom,type,cap,rem:''}),I=[i('Gymnase municipal','Gymnase',2),i('Salle de danse','Salle spécialisée',1),i('Stade','Piste / stade',2),i('Piscine intercommunale','Piscine',1)];
 S={v:1,etab:'Lycée de démonstration',auteur:'C. MARTIN',org:null,profs:P,inst:I,classes:{}};O();
 const C=(cl,niv,pr,cr,prog)=>{const K=S.classes[cl]={niveau:niv,prof:P[pr].id,eval:'T',cren:cr.map(([j,hd,hf,sem,ins])=>({id:uid(),jour:j,hd,hf,sem:sem||'AB',inst:I[ins].id,prof:''})),cycles:[]};
  repartir(prog.length,cl);sortCy(K).forEach((c,n)=>{const[nom,ins]=prog[n];c.nom=nom;c.ca=caOf(nom);c.inst=ins==null?'':I[ins].id;const d=evDefault(cl,c);c.evals=d?[{type:/^T/.test(cl)?'CCF':'Fin de cycle',date:d}]:[]})};
 C('2NDE 1','2nde',0,[[1,'08:00','10:00','AB',0]],[['Natation',3],['Badminton'],['Acrosport',1],['Course d\'orientation',2]]);
 C('2NDE 2','2nde',1,[[1,'08:00','10:00','AB',0]],[['Athlétisme',2],['Volley-ball'],['Natation',3],['Danse chorégraphiée',1]]);
 C('2NDE 3','2nde',2,[[2,'10:00','12:00','AB',0]],[['Badminton'],['Natation',3],['Course d\'orientation',2],['Acrosport',1]]);
 C('1G 1','1re',0,[[4,'13:30','15:30','AB',2]],[['Athlétisme'],['Handball',0],['Musculation',0]]);
 C('1G 2','1re',3,[[4,'13:30','15:30','AB',0]],[['Musculation'],['Basket-ball'],['Escalade',2]]);
 C('TG 1','Tle',1,[[5,'08:00','10:00','AB',0]],[['Badminton'],['Course d\'orientation',2],['Danse chorégraphiée',1]]);
 C('1 MRC','1re Pro',3,[[2,'14:00','16:00','A',2],[5,'10:00','12:00','AB',0]],[['Tennis de table'],['Run & Bike',2],['Musculation']]);
 U.cl='2NDE 1';OM='🧪 Exemple chargé : 4 enseignants, 4 installations, 7 classes programmées';save();render()}

/* ───── Fenêtres ───── */
function modal(h,bind){$('#mo').innerHTML=h;$('#ov').hidden=false;bind&&bind($('#mo'))}
function close(){$('#ov').hidden=true;$('#mo').innerHTML=''}
function confirmBtn(btn,fn){btn.onclick=()=>{if(btn.dataset.ok){fn();return}btn.dataset.ok=1;btn.textContent='Confirmer la suppression ?'}}
function msg(t,ko){const m=$('#sm')||$('#om')||$('#st');if(m){m.style.color=ko?'var(--ko)':'var(--ok)';m.textContent=t}}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov'||e.target.closest('[data-m=close]'))close()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#ov').hidden)close()});

/* ───── Événements ───── */
$('#view').addEventListener('change',e=>{const t=e.target,k=t.dataset.k;if(!k)return;const o=O(),oc=selCl(),K=oc?KL(oc):null,val=t.value;
 if(k==='etab'||k==='auteur')S[k]=val.trim();
 else if(k==='zone'){o.zone=val;o.vac=vacDef(val);OM='Vacances remplacées par le calendrier de la zone '+val}
 else if(['debut','fin','ab'].includes(k))o[k]=val;else if(k==='als')o.als=t.checked;else if(k==='pent')o.pent=t.checked;
 else if(k==='vac')o.vac[+t.dataset.i][t.dataset.p]=val;
 else if(k==='per')o.per[t.dataset.pt][+t.dataset.i][t.dataset.p]=val;
 else if(k==='pf'){const p=PR(t.dataset.id),f=t.dataset.p;p[f]=f==='ors'||f==='as'?+val||0:f==='nom'?val.trim().toUpperCase():val.trim();if(f==='statut')p.ors=STAT[val][1]}
 else if(k==='in'){const i=IN(t.dataset.id),f=t.dataset.p;i[f]=f==='cap'?Math.max(1,+val||1):val.trim()}
 else if(k==='kniv')KL(t.dataset.c).niveau=val;else if(k==='kprof')KL(t.dataset.c).prof=val;
 else if(k==='cr'){const c=K.cren[+t.dataset.i],f=t.dataset.p;c[f]=f==='jour'?+val:val;if(f==='hd'&&c.hf<c.hd)c.hf=c.hd}
 else if(k==='eval')K.eval=val;
 else if(k==='cy'){const c=K.cycles.find(x=>x.id===t.dataset.id),f=t.dataset.p;c[f]=f==='nom'?val.trim()||c.nom:val;if(f==='nom'&&val in APSA)c.ca=caOf(val);if(f==='du'&&c.au&&c.au<val)c.au=val}
 else if(k==='ev'){const c=K.cycles.find(x=>x.id===t.dataset.id);c.evals[+t.dataset.i][t.dataset.p]=val}
 else if(k==='cyc-cr'){const c=K.cycles.find(x=>x.id===t.dataset.id);c.cren=(c.cren||[]).filter(x=>x!==val);if(t.checked)c.cren.push(val)}
 else if(k==='ef'||k==='ew'||k==='pc'||k==='pn'){U[k]=val;return render()}
 save();render()});
$('#view').addEventListener('click',async e=>{const b=e.target.closest('[data-o]');if(!b)return;const a=b.dataset.o,o=O(),oc=selCl(),K=oc?KL(oc):null;
 if(a==='cl'||a==='pcl'){U.cl=b.dataset.c;U.scr=1;if(a==='pcl'&&U.view!=='prog')U.view='prog';return render()}
 if(a==='blk')return crModal(b.dataset.c,b.dataset.id);
 if(a==='print'){const c=b.closest('.card');document.body.dataset.pr=b.dataset.p;c.classList.add('prx');setTimeout(()=>{print();delete document.body.dataset.pr;c.classList.remove('prx')},50);return}
 if(/-rm$/.test(a)&&!b.dataset.ok){b.dataset.ok=1;b.textContent='Supprimer ?';return}
 if(a==='vac-add')o.vac.push({nom:'Vacances',du:o.debut,au:o.debut});
 else if(a==='vac-rm')o.vac.splice(+b.dataset.i,1);
 else if(a==='vac-def'){if(annee()!=='2026-2027'){OM='⚠ Le calendrier intégré ne couvre que 2026-2027 : utilisez la mise à jour en ligne ou saisissez les dates';return render()}o.vac=vacDef(o.zone);OM='✅ Calendrier officiel 2026-2027, zone '+o.zone}
 else if(a==='vac-net'){$('#om').textContent='Chargement…';try{o.vac=await vacNet();OM='✅ Vacances mises à jour depuis le calendrier officiel en ligne'}catch(x){$('#om').textContent='❌ Serveur injoignable ('+(x.message||x)+') : calendrier actuel conservé';return}}
 else if(a==='int-rm')o.inter.splice(+b.dataset.i,1);
 else if(a==='flip'){const m=b.dataset.m,i=o.flip.indexOf(m);if(i<0)o.flip.push(m);else o.flip.splice(i,1)}
 else if(a==='pf-add')S.profs.push({id:uid(),nom:'',prenom:'',statut:'cert',ors:20,as:3,couleur:PAL[S.profs.length%PAL.length]});
 else if(a==='pf-rm'){const id=b.dataset.id;S.profs=S.profs.filter(p=>p.id!==id);Object.values(S.classes).forEach(k=>{if(k.prof===id)k.prof='';k.cren.forEach(c=>{if(c.prof===id)c.prof=''})})}
 else if(a==='in-add')S.inst.push({id:uid(),nom:'',type:'Gymnase',cap:1,rem:''});
 else if(a==='in-rm'){const id=b.dataset.id;S.inst=S.inst.filter(i=>i.id!==id);Object.values(S.classes).forEach(k=>{k.cren.forEach(c=>{if(c.inst===id)c.inst=''});k.cycles.forEach(c=>{if(c.inst===id)c.inst=''})})}
 else if(a==='cl-rm'){delete S.classes[b.dataset.c];OM='Classe retirée'}
 else if(a==='cl-mae'){const L=maeCls();L.forEach(c=>KL(c));OM=`✅ ${L.length} classe(s) ajoutée(s) depuis la liste Mes Apps EPS`}
 else if(a==='gen-cl'){const f=b.closest('form'),pre=f.pre.value||'',n=Math.min(30,+f.nb.value||0);if(!pre.trim()||!n){f.pre.focus();return}f.noms.value=[f.noms.value.trim(),...[...Array(n)].map((_,i)=>pre+(i+1))].filter(Boolean).join(', ');return}
 else if(a==='ev-add'){const c=K.cycles.find(x=>x.id===b.dataset.id);(c.evals=c.evals||[]).push({type:(c.evals.length?'CCF rattrapage':'Fin de cycle'),date:evDefault(oc,c)})}
 else if(a==='ev-rm'){const c=K.cycles.find(x=>x.id===b.dataset.id);c.evals.splice(+b.dataset.i,1)}
 else if(a==='next')return nextModal();
 else if(a==='cr-add'){const l=K.cren[K.cren.length-1],c={id:uid(),jour:l?l.jour:1,hd:l?l.hd:'08:00',hf:l?l.hf:'10:00',sem:'AB',inst:l?l.inst:'',prof:''};K.cren.push(c);K.cycles.forEach(y=>{if(!y.cren||y.cren.length===K.cren.length-1)(y.cren=y.cren||[]).push(c.id)})}
 else if(a==='cr-rm'){const id=K.cren[+b.dataset.i].id;K.cren.splice(+b.dataset.i,1);K.cycles.forEach(c=>c.cren=(c.cren||[]).filter(x=>x!==id))}
 else if(a==='cy-add'){const l=sortCy(K).filter(c=>c.au).pop(),du=l?addD(l.au,1):'';K.cycles.push({id:uid(),nom:'Nouveau cycle',ca:'',du,au:'',inst:'',cren:K.cren.map(x=>x.id)})}
 else if(a==='cy-rm')K.cycles=K.cycles.filter(c=>c.id!==b.dataset.id);
 else if(a==='rep')repartir(Math.max(1,+$('#nrep').value||3),oc);
 else if(a==='copy')return copyModal(oc);
 else return;
 save();render()});
$('#view').addEventListener('submit',e=>{const f=e.target;e.preventDefault();
 if(f.id==='fint'){O().inter.push({id:uid(),nom:f.nom.value.trim(),du:f.du.value,au:f.au.value<f.du.value?f.du.value:f.au.value,classes:[...f.querySelectorAll('[name=cl]:checked')].map(x=>x.value)});OM='✅ Période ajoutée'}
 else if(f.id==='fcl'){const L=[...new Set(f.noms.value.split(/[,;\n]+/).map(x=>x.trim().replace(/\s+/g,' ')).filter(Boolean))],nv=f.niv.value;if(!L.length)return;
  let n=0;for(const c of L){if(S.classes[c])continue;KL(c);if(nv)S.classes[c].niveau=nv;n++}U.cl=L[0];OM=`✅ ${n} classe(s) ajoutée(s)${n<L.length?' ('+(L.length-n)+' déjà présente(s))':''} : réglez niveau, enseignant et créneaux`}
 save();render()});
document.addEventListener('click',async e=>{const n=e.target.closest('[data-nav]');if(n){U.view=n.dataset.nav;render();scrollTo(0,0);return}
 const g=e.target.closest('[data-g]');if(!g)return;const k=g.dataset.g;
 if(k==='share'){U.view='share';render();scrollTo(0,0)}
 else if(k==='list')$('#fList').click();else if(k==='demo')demo();
 else if(k==='dl')dlPack('');else if(k==='dlp')dlPack(g.dataset.id);
 else if(k==='xlsx'){try{dlBlob(synthese(),`CoordoEPS_synthese_${slug(S.etab)||'equipe'}_${annee()}.xlsx`);msg('⬇ Tableau de synthèse lancé')}catch(x){msg('❌ '+x.message,1)}}
 else if(k==='sync')sync();else if(k==='xmae')exportMAE();else if(k==='rest')$('#fJson').click();
 else if(k==='reset'){if(!g.dataset.ok){g.dataset.ok=1;g.textContent='Confirmer : tout effacer ?';return}S={v:1,etab:'',auteur:'',org:null,profs:[],inst:[],classes:{}};OM='Programmation effacée';save();render()}});
$('#fList').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{await EPS.importFile(f);E=await EPS.all();msg(`✅ ${E.length} élève(s) chargé(s)`);render()}catch(x){msg('❌ '+x.message,1)}};
$('#fJson').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const j=JSON.parse(await f.text());if(j.format!==FMT||!j.classes)throw new Error('ce n\'est pas un fichier CoordoEPS');
 if(j.pour&&!confirm(`Ce fichier ne contient que les classes de ${(j.profs||[]).find(p=>p.id===j.pour)?.nom||'un enseignant'}. Le restaurer quand même ?`))return;
 const cl={};for(const[k,v]of Object.entries(j.classes)){const{effectif,...r}=v;cl[k]=r}
 S={v:1,etab:j.etab||'',auteur:j.auteur||'',org:j.org||null,profs:j.profs||[],inst:j.inst||[],classes:cl};OM=`✅ Programmation restaurée : ${Object.keys(cl).length} classe(s)`;save();render()}catch(x){msg('❌ '+x.message,1)}};

$('#apsaL').innerHTML=Object.keys(APSA).map(a=>`<option value="${esc(a)}">`).join('');
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
(async()=>{try{E=await EPS.all()}catch(x){E=[]}render()})();
}
